name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json
      - name: Системные зависимости распознавания документов (poppler, tesseract)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-rus
      - name: Установка зависимостей
        run: cd services/api-gateway && npm ci
      - name: Синтаксис всех JS-файлов бэкенда
        run: |
          cd services/api-gateway
          for f in $(find src -name '*.js'); do node --check "$f"; done
      - name: Юнит-тесты (ИНН, разбор выписок)
        run: cd services/api-gateway && npm test
      - name: Аудит зависимостей (high и выше — блокирует)
        run: cd services/api-gateway && npm audit --audit-level=high --omit=dev

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web-client/package-lock.json
      - name: Установка зависимостей
        run: cd apps/web-client && npm ci
      - name: Проверка типов TypeScript
        run: cd apps/web-client && npx tsc --noEmit
      - name: Прод-сборка Next.js (ловит поломки сборки до деплоя)
        run: cd apps/web-client && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_SUPPORT_EMAIL: support@example.ru
      # Информационный (не блокирует): текущие high-advisory — только в Next.js
      # и его postcss, и закрываются лишь мажорным апгрейдом Next 14→15/16
      # (breaking, вынесен в отдельный трек). Конфиг приложения (без rewrites,
      # без Server Actions) делает эти advisory в основном неприменимыми, но
      # держим их на виду, чтобы не потерять при появлении патча в 14.x.
      - name: Аудит зависимостей фронтенда (информационно)
        run: cd apps/web-client && npm audit --audit-level=high || true
